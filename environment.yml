name: al
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # PyTorch with CUDA 12.x
  - pytorch=2.1.*
  - pytorch-cuda=12.1
  - torchvision
  # Scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  # Bioinformatics
  - biopython>=1.81
  - pip:
    # GP library (exact version for reproducibility)
    - gpytorch==1.11
    # ESM-2 protein language model
    - fair-esm==2.0.0
    # Other PLMs
    - transformers>=4.35
    - huggingface_hub>=0.19
    - ablang2
    # SHAP explainability
    - shap>=0.43
    # 3D structure visualisation in notebooks
    - py3Dmol
    # Utilities
    - tqdm>=4.65
    - pyyaml>=6.0
    - jupyter
    - ipywidgets
